name: Repository safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-code-only-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public files
        run: python scripts/verify_repository.py
